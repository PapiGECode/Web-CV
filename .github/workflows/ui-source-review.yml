name: UI source review
on:
  push:
    branches: [fix/phone-ui-polish-20261004]
    paths: [.github/workflows/ui-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d6ed79f04954967c726e02e0c5c897382b75809
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o ui-source.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source-review
          path: ui-source.tgz
          retention-days: 2
