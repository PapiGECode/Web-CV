name: Portfolio quality
on:
  push:
    branches: [master, feat/art-direction-20261004]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHROME_PATH: /usr/bin/google-chrome
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check js/motion.js
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Browser visual check
        run: |
          node scripts/serve.mjs > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          AB="$PWD/node_modules/.bin/agent-browser"
          "$AB" --args '--no-sandbox' open about:blank
          "$AB" set viewport 1440 960
          "$AB" open http://localhost:3000
          "$AB" wait --load networkidle
          "$AB" wait '#hero h1'
          "$AB" eval 'JSON.stringify({ready:window.__portfolioReady,motion:document.documentElement.dataset.motion,theme:document.documentElement.className})' > review-reports/browser-diagnostics.txt
          "$AB" errors > review-reports/browser-errors.txt
          "$AB" snapshot -i > review-reports/interactive-elements.txt
          "$AB" screenshot review-reports/desktop-motion.png
          "$AB" close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality
          path: |
            review-reports/
            playwright-report/
            test-results/
          retention-days: 5
