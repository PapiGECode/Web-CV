name: Apply verified UI refinement
on:
  push:
    branches: [fix/phone-ui-polish-20261004]
    paths: [.github/workflows/apply-ui-review.yml, '.ui-review/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHROME_PATH: /usr/bin/google-chrome
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply checksum-verified UI-only changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          root=Path.cwd()
          allowed={'css/project-phones.css','css/quality.css','js/app.js','js/project-phones.js','tests/ui-refinement.spec.js'}
          packed=base64.b64decode(Path('.ui-review/changes.b64').read_text(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='993bfd8625947769e43adda2d746d3ab5217553e3df20aba5135245bcd550769'
          records=json.loads(gzip.decompress(packed)); prepared=[]
          assert {r['p'] for r in records}==allowed and len(records)==len(allowed)
          for row in records:
              p=root/row['p']
              if row['before'] is None:
                  assert not p.exists()
                  text=row['text']
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==row['before'],f"Concurrent change: {row['p']}"
                  text=before.decode()
                  for start,end,replacement in reversed(row['edits']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==row['after'],f"Output mismatch: {row['p']}"
              prepared.append((p,text))
          for p,text in prepared: p.write_text(text)
          print('Verified all five UI/test files. No content, bezel, base styles, APIs or credentials changed.')
          PY
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Commit only the verified files and remove temporary transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- css/project-phones.css css/quality.css js/app.js js/project-phones.js tests/ui-refinement.spec.js
          git rm -r -- .ui-review
          git rm -- .github/workflows/apply-ui-review.yml .github/workflows/ui-source-review.yml
          git commit -m 'fix: align phone corner geometry and refine existing project UI'
          git push origin HEAD:fix/phone-ui-polish-20261004
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-review
          path: |
            review-reports/
            playwright-report/
            test-results/
          retention-days: 3
