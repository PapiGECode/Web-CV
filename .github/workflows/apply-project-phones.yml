name: Apply verified project phones
on:
  push:
    branches: [fix/project-facts-contrast-20261004]
    paths: [.github/workflows/apply-project-phones.yml, '.phone-stage/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and apply reviewed frontend changes
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,gzip,hashlib,json,re,urllib.request
          root=Path.cwd()
          packed=base64.b64decode(''.join(p.read_text() for p in sorted(Path('.phone-stage').glob('*.b64'))),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='80afcb839f7d16dbd7dcbd35267079972458949f092c211d6dca22fdade11bff'
          records=json.loads(gzip.decompress(packed)); prepared=[]
          original=(root/'index.html').read_text()
          hero=original[original.index('      <!-- HERO -->'):original.index('      <!-- MARQUEE -->')]
          base_css=(root/'css/styles.css').read_bytes()
          for row in records:
              rel=PurePosixPath(row['p'])
              assert not rel.is_absolute() and not any(x in ['..','.git','.github'] or x.startswith('.env') for x in rel.parts)
              p=root/rel
              if row['b'] is None:
                  assert not p.exists(),f'Unexpected destination {rel}'
                  text=row['text']
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==row['b'],f'Concurrent change {rel}'
                  text=before.decode()
                  if not row.get('delete'):
                      for start,end,replacement in reversed(row['edits']):
                          text=text[:start]+replacement+text[end:]
                      assert hashlib.sha256(text.encode()).hexdigest()==row['sha'],f'Output mismatch {rel}'
              prepared.append((p,None if row.get('delete') else text))
          for p,text in prepared:
              if text is None: p.unlink()
              else:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          updated=(root/'index.html').read_text()
          assert updated[updated.index('      <!-- HERO -->'):updated.index('      <!-- MARQUEE -->')]==hero
          assert (root/'css/styles.css').read_bytes()==base_css
          assert 'id="foot-word"' in updated
          p=root/'tests/polish.spec.js'; raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='e2bc81288d621d09d72221dff8b023fa970786c9'
          text=raw.decode(); assert "['#copy-message', '#mail-draft']" in text
          p.write_text(text.replace("['#copy-message', '#mail-draft']","['#mail-draft']"))
          p=root/'privacidad.html';text=p.read_text()
          text=re.sub(r'<button\b[^>]*data-copy-(?:email|url)[^>]*>.*?</button>','',text,flags=re.S)
          text=text.replace('>Preferencias de medición</button>','>Preferencias</button>');p.write_text(text)
          data=urllib.request.urlopen('https://raw.githubusercontent.com/PapiGECode/thiagoiutu-portfolio/main/assets/iphone18-pro-max-bezel.png',timeout=30).read()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='ac8552a83124d3241f76b4baacd8a5c5f783740b'
          (root/'assets/iphone18-pro-max-bezel.png').write_bytes(data)
          paths=[r['p'] for r in records]+['tests/polish.spec.js','privacidad.html','assets/iphone18-pro-max-bezel.png']
          Path('/tmp/phone-change-paths.json').write_text(json.dumps(paths))
          print('Verified source, output checksums, original bezel and preserved hero/base CSS.')
          PY
      - name: Apply findings from real Chromium review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/project-phones.js');s=p.read_text()
          assert 'Math.max(62,44 / scale)' in s and 'target + 25' in s
          s=s.replace('Math.max(62,44 / scale)','Math.max(62,Math.ceil(45 / scale))').replace('target + 25','target + 28')
          p.write_text(s)
          p=Path('css/project-phones.css');s=p.read_text();assert 'overscroll-behavior:auto' in s
          p.write_text(s.replace('overscroll-behavior:auto','overscroll-behavior:contain'))
          p=Path('tests/phones.spec.js');s=p.read_text()
          # The original test assumed >70px of scroll range; the real pane has 48px.
          # Measure from the top and verify both internal movement and edge containment.
          s=s.replace('el=>el.scrollTop=70','el=>el.scrollTop=0')
          s=s.replace("expect(await phone.locator('.pf-scroll').evaluate(el=>el.scrollTop)).toBeGreaterThan(70);", "await expect.poll(()=>phone.locator('.pf-scroll').evaluate(el=>el.scrollTop)).toBeGreaterThan(0);")
          anchor="expect(await phone.locator('.phone-bezel').evaluate(el=>getComputedStyle(el).pointerEvents)).toBe('none');"
          assert anchor in s
          s=s.replace(anchor,"await phone.locator('.pf-scroll').evaluate(el=>el.scrollTop=el.scrollHeight);\n  await page.mouse.wheel(0,300);await page.waitForTimeout(150);\n  expect(Math.abs(await page.evaluate(()=>scrollY)-y)).toBeLessThan(2);\n  "+anchor)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Commit only verified changes on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json,subprocess
          subprocess.run(['git','add','--',*json.load(open('/tmp/phone-change-paths.json'))],check=True)
          PY
          git rm -r -- .phone-stage
          git rm -- .github/workflows/apply-project-phones.yml .github/workflows/phone-source-review.yml
          git commit -m 'feat: interactive project phones, corrected project facts and visible evidence cards'
          git push origin HEAD:fix/project-facts-contrast-20261004
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-phones-review
          path: |
            review-reports/
            playwright-report/
            test-results/
          retention-days: 3
