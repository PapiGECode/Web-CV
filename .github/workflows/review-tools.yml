name: Review telemetry libraries
on:
  push:
    branches: [feat/quality-contact-20261004]
    paths: [.github/workflows/review-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/telemetry-tools
          cd /tmp/telemetry-tools
          npm init -y
          npm install --save-exact web-vitals @vercel/analytics @vercel/speed-insights
          tar -czf /tmp/telemetry-tools.tgz -C /tmp telemetry-tools
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-tools
          path: /tmp/telemetry-tools.tgz
          retention-days: 2
