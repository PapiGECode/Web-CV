name: Verify source transfer
on:
  push:
    branches: [feat/quality-contact-20261004]
    paths: [.github/workflows/review-tools.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive staged source and workflow for integrity review
        run: tar -czf /tmp/source-transfer.tgz .review .github/workflows/apply-quality.yml
      - uses: actions/upload-artifact@v4
        with:
          name: source-transfer
          path: /tmp/source-transfer.tgz
          retention-days: 2
