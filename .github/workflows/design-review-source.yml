name: Design review workspace
on:
  push:
    branches: [feat/art-direction-20261004]
    paths: [.github/workflows/design-review-source.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Package tracked source and reproducible build tools
        run: |
          mkdir -p /tmp/design-review
          git archive HEAD | tar -x -C /tmp/design-review
          cp -a node_modules dist /tmp/design-review/
          tar -czf /tmp/design-review.tgz -C /tmp/design-review .
      - uses: actions/upload-artifact@v4
        with:
          name: design-review-source
          path: /tmp/design-review.tgz
          retention-days: 2
